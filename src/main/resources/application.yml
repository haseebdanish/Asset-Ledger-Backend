server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assetledger}
    username: ${DB_USERNAME:danish}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: INFO
